<!-- 11. WARRANTY DEED -->\n            <section>\n                <h3>11. Warranty Deed</h3>\n                <p style=\"font-size: 11px;\">Seller agrees to convey fee simple title of the Real Property to Buyer by a good and sufficient Warranty Deed, subject only to any and all provisions of any ordinance, municipal regulation, public or private law, restrictions, and easements as appearing of record, if any, provided they do not affect the marketability of title. All real estate taxes, utilities, water and sewer charges, and the current water and sewer assessment balance, if any, shall be paid by Seller at closing or, if appropriate, prorated at closing, and shall not be considered an impediment to title. Seller warrants that Seller has no knowledge and/or notice of any outstanding violations from any town, city, or state agency relating to the property.</p>\n            </section>\n\n            <!-- 12. TITLE APPROVAL -->\n            <section>\n                <h3>12. Title Approval</h3>\n                <p style=\"font-size: 11px;\">Title to be conveyed by Seller shall be fee simple marketable title (\"Marketable Title\") and insurable at standard rates by the title company of Buyer's choosing. Seller further agrees to execute such documents as may be reasonably required by Buyer's title insurance company or by Buyer's mortgage lender. Buyer has the right to accept or reject the title commitment from the title company. If Buyer rejects the title commitment for any reason, Buyer may terminate this contract and receive the Earnest Money, thereby releasing Seller from this contract. Upon any title objections that may occur, Buyer has the right to extend this contract for such time as necessary for Seller and the Title Company to clear title, or Buyer may terminate this contract and receive the Earnest Money, thereby releasing Seller from this contract. Buyer has seven (7) days after objections to title have been cured to close, or the aforementioned Closing Date, whichever is later.</p>\n            </section>\n\n            <!-- 13. ADJUSTMENTS / PRORATIONS -->\n            <section>\n                <h3>13. Adjustments / Prorations</h3>\n                <p style=\"font-size: 11px;\">Unless otherwise expressly agreed upon, all fees shall be adjusted pro rata as of the Closing Date in accordance with what is normal and customary in the state where the property resides, including but not limited to, if applicable: real property taxes and assessments, interest, escrow fees, transfer tax fees, association fees, water and sewer usage, and rent. Rent security deposits, if any, shall be credited to Buyer by Seller on the Closing Date and shall include any interest accrued to the tenant.</p>\n            </section>\n\n            <div class=\"initials-bar\">\n                <div>Seller Initials: <input type=\"text\" maxlength=\"3\"></div>\n                <div>Buyer Initials: <input type=\"text\" maxlength=\"3\"></div>\n            </div>\n\n            <!-- 14. BUYER'S DEFAULT / SELLER'S DEFAULT -->\n            <section>\n                <h3>14. Buyer's Default / Seller's Default</h3>\n                <p style=\"font-size: 11px;\">If Buyer fails to comply with any terms of this Agreement by the time set forth for compliance, and Seller is not in default, Seller shall be entitled to all initial and additional deposit funds provided for in Section 4, whether or not Buyer has paid the same, as liquidated damages, and both parties shall be relieved of further liability under this Agreement.</p>\n            </section>\n\n            <!-- 15. RISK OF LOSS, DAMAGE -->\n            <section>\n                <h3>15. Risk of Loss, Damage</h3>\n                <p style=\"font-size: 11px;\">All risk of loss or damage to said property, by any means, shall be assumed by Seller until delivery of the Deed, provided Buyer did not cause the loss or damage. In the event the loss or damage exceeds $5,000.00, Buyer shall have the option to receive any insurance payment on account of said damage and take title, or to rescind this Agreement and receive back all deposit money paid. If Buyer rescinds the Agreement, all rights and obligations of the parties under this Agreement shall terminate.</p>\n            </section>\n\n            <!-- 16. COMMON INTEREST COMMUNITY -->\n            <section>\n                <h3>16. Common Interest Community</h3>\n                <p style=\"font-size: 11px;\">If the property is a unit in a condominium or other common interest community, Seller will deliver the resale documents in accordance with local statutes and customs.</p>\n            </section>\n\n            <!-- 17. LISTING BROKER -->\n            <section>\n                <h3>17. Listing Broker (If applicable)</h3>\n                <div class=\"grid\">\n                    <div class=\"form-group\">\n                        <label>Listing Broker - Phone:</label>\n                        <input type=\"text\" name=\"listing_broker\">\n                    </div>\n                    <div class=\"form-group\">\n                        <label>Cooperating Broker - Phone:</label>\n                        <input type=\"text\" name=\"cooperating_broker\">\n                    </div>\n                    <div class=\"form-group grid-full\">\n                        <label>Buyer's Agent:</label>\n                        <input type=\"text\" name=\"buyers_agent\">\n                    </div>\n                </div>\n            </section>\n\n            <!-- 18. MANDATORY SELLER DISCLOSURES -->\n            <section>\n                <h3>18. Mandatory Seller Disclosures</h3>\n                <p style=\"font-size: 11px;\">Seller shall deliver to Buyer, within the time specified by statute (or, if not specified, within seven (7) days of acceptance of the offer), all Seller disclosures required by law in the state where the property resides. If Seller fails to deliver such disclosures within the time specified above, Buyer reserves the right to all remedies available to Buyer under applicable law.</p>\n            </section>\n\n            <!-- 19. ASSIGNABILITY AND NOVATION -->\n            <section>\n                <h3>19. Assignability and Novation</h3>\n                <p style=\"font-size: 11px;\">Seller hereby grants to Buyer, its successors, assigns, nominees, partners, and/or affiliated entities, the irrevocable right to assign, sell, transfer, or otherwise convey Buyer's contractual interest in this Agreement to any third party, including another investor or end buyer, without further consent from Seller. Buyer may also partner with other investors or novate this Agreement with a replacement agreement. Seller acknowledges and agrees that Buyer may market and transfer its contractual interest for a profit. Upon assignment or novation, Buyer may be released from further obligations if the assignee or replacement purchaser assumes the obligations of this Agreement, subject to the closing agent's requirements. Seller agrees to reasonably cooperate with the title/escrow company and execute customary documents necessary to complete the assignment, novation, or direct closing, provided Buyer is not required to incur an obligation to purchase the Property solely because an assignee or end buyer fails to close.</p>\n            </section>\n\n            <!-- 20. DISCLOSURES AND CONTRACT PROVISIONS -->\n            <section>\n                <h3>20. Disclosures and Contract Provisions</h3>\n                <p style=\"font-size: 11px;\">Seller understands, upon signing this Agreement, that Buyer will possess a contractual interest in the property, and agrees that Buyer, in its sole discretion, has the exclusive right to market the Property and/or this Purchase Agreement for sale to third parties in any way prior to settlement of the Purchase Agreement. Such marketing may include listing the property for sale in a multiple listing service. Seller consents to Buyer conducting such marketing, at Buyer's expense, in an effort to fulfill the obligations outlined within this Purchase Agreement.</p>\n            </section>\n\n            <!-- 21. RESALE OF PROPERTY -->\n            <section>\n                <h3>21. Resale of Property</h3>\n                <p style=\"font-size: 11px;\">Seller agrees that Buyer, on this contract, retains \"all profit,\" whether by note, trade, or cash, in the event of resale of this property, simultaneous close, assignment, or novation of this contract. Buyer may advertise, market, assign, or otherwise transfer Buyer's contractual interest in this Agreement before closing. Any assignment, resale, or other transfer is a transfer of Buyer's contractual rights and does not constitute a representation that Buyer is the owner of the Property before closing.</p>\n            </section>\n\n            <!-- 22. EQUAL HOUSING RIGHTS -->\n            <section>\n                <h3>22. Equal Housing Rights</h3>\n                <p style=\"font-size: 11px;\">This Agreement is subject to all local statutory laws prohibiting discrimination in commercial and residential real estate transactions.</p>\n            </section>\n\n            <!-- 23. ADDENDUMS AND ADVISORIES -->\n            <section>\n                <h3>23. Addendums and Advisories</h3>\n                <p style=\"font-size: 11px;\">The following attached Addenda and/or Advisories are part of this Agreement:</p>\n                <div class=\"grid\">\n                    <div class=\"form-group\"><label>Addendum 1:</label><input type=\"text\" name=\"addendum_1\"></div>\n                    <div class=\"form-group\"><label>Addendum 2:</label><input type=\"text\" name=\"addendum_2\"></div>\n                    <div class=\"form-group\"><label>Advisory 1:</label><input type=\"text\" name=\"advisory_1\"></div>\n                    <div class=\"form-group\"><label>Advisory 2:</label><input type=\"text\" name=\"advisory_2\"></div>\n                    <div class=\"form-group\"><label>Advisory 3:</label><input type=\"text\" name=\"advisory_3\"></div>\n                    <div class=\"form-group\"><label>Advisory 4:</label><input type=\"text\" name=\"advisory_4\"></div>\n                </div>\n            </section>\n\n            <!-- 24. ADDITIONAL TERMS AND CONDITIONS -->\n            <section>\n                <h3>24. Additional Terms and Conditions</h3>\n                <p style=\"font-size: 11px;\">a. Real estate commissions, if any, shall only apply and be payable through escrow at closing if a licensed real estate broker or agent is actively involved in representing a party to this transaction.</p>\n                <p style=\"font-size: 11px;\">b. Buyer pays all closing costs.</p>\n                <div class=\"form-group\">\n                    <label>Other Custom Terms:</label>\n                    <textarea name=\"additional_custom_terms\"></textarea>\n                </div>\n            </section>\n\n            <!-- 25. EMAIL OR FAX TRANSMISSION -->\n            <section>\n                <h3>25. Email or Fax Transmission</h3>\n                <p style=\"font-size: 11px;\">The parties acknowledge that this Agreement and any addenda, modification, and/or notices due hereunder may be transmitted between them by facsimile machine, e-fax, or email, and the parties intend that an emailed or faxed document containing either the original and/or copies of the parties' signatures shall be binding and of full effect.</p>\n            </section>\n\n            <!-- 26. COMPLETE AGREEMENT -->\n            <section>\n                <h3>26. Complete Agreement</h3>\n                <p style=\"font-size: 11px;\">Each party acknowledges that this Agreement contains the entire agreement between Buyer and Seller concerning this transaction and supersedes any and all previous agreements concerning the Property, and that such party has not relied on any oral contract, statement, representation, or other promise not expressed in writing in this contract. Any extensions or modifications of this Agreement shall be in writing, signed by the parties.</p>\n            </section>\n\n            <!-- 27. MEMORANDUM OF CONTRACT -->\n            <section>\n                <h3>27. Memorandum of Contract</h3>\n                <p style=\"font-size: 11px;\">Seller agrees that Buyer may execute, acknowledge, and record a memorandum of this contract in the official records of the county, at Buyer's discretion and at Buyer's expense.</p>\n            </section>\n\n            <!-- 28. NOTICE -->\n            <section>\n                <h3>28. Notice</h3>\n                <p style=\"font-size: 11px;\">Any notice required or permitted under the terms of this Agreement by Buyer or Seller shall be in writing, addressed to the party concerned using the address stated in Paragraph 1 of this Agreement, or to such party's attorney, or to the party's Listing Broker or Cooperating Broker.</p>\n            </section>\n\n            <!-- 29. SHORT SALE -->\n            <section>\n                <h3>29. Short Sale</h3>\n                <p style=\"font-size: 11px;\">In the case of a short sale, the parties shall work together so that the bank/lender or any lien holders agree to hold Seller, or named persons on title as of this Agreement, harmless from any further action, and will not hold Seller accountable for any remaining amounts owed.</p>\n            </section>\n\n            <!-- 30. LICENSE ACKNOWLEDGEMENT -->\n            <section>\n                <h3>30. License Acknowledgement</h3>\n                <div class=\"grid\">\n                    <div class=\"checkbox-group\">\n                        <input type=\"checkbox\" id=\"buyer_licensed\" name=\"buyer_licensed\">\n                        <label for=\"buyer_licensed\">Buyer is a licensed realtor in the state of:</label>\n                    </div>\n                    <div class=\"form-group\">\n                        <input type=\"text\" name=\"buyer_license_state\">\n                    </div>\n                    <div class=\"checkbox-group\">\n                        <input type=\"checkbox\" id=\"seller_licensed\" name=\"seller_licensed\">\n                        <label for=\"seller_licensed\">Seller is a licensed realtor in the state of:</label>\n                    </div>\n                    <div class=\"form-group\">\n                        <input type=\"text\" name=\"seller_license_state\">\n                    </div>\n                </div>\n            </section>\n\n            <!-- 31. SELLER'S AGREEMENTS AND COVENANTS -->\n            <section>\n                <h3>31. Seller's Agreements and Covenants</h3>\n                <p style=\"font-size: 11px;\">Seller is of lawful age, is of sound mind, and is able to make rational decisions. Seller is not now under the undue influence of alcohol, drugs, or any other mind-altering substance, nor is Seller taking medication that would cloud Seller's judgment or make Seller unable to think clearly. Seller is who they say they are, is the owner of the Property, and is able to contract for its sale without any additional joinder by others. Seller is not under duress and has agreed to sell the Property to Buyer freely and willingly. Seller has agreed to sell the Property to Buyer only because it is in Seller's best interest after considering all of the factors. Seller understands what Seller is signing and has had all of Seller's questions answered. Seller is, therefore, not confused about any of the provisions of this Agreement. Seller understands, by signing this Agreement, that Seller has agreed to sell the Property to Buyer and is now bound by the terms and conditions described in this Agreement. Seller further understands that Seller cannot \"change their mind\" or cancel the contract at a later date without being in default of this Agreement, nor may Seller continue to market the Property to any other buyer or tenant.</p>\n            </section>\n\n            <!-- 32. TIME TO ACCEPT -->\n            <section>\n                <h3>32. Time to Accept</h3>\n                <p style=\"font-size: 11px;\"><strong>SELLER ACKNOWLEDGMENT:</strong> Seller acknowledges that Buyer may be an investor and may assign or transfer this Agreement to another buyer or investor and may receive a profit or other consideration from that transaction. Seller's purchase price and other rights under this Agreement are not changed by any assignment, except as expressly agreed in writing.</p>\n                <div class=\"form-group\" style=\"max-width: 300px;\">\n                    <label>Seller shall have until (Date/Time) to accept this Agreement:</label>\n                    <input type=\"text\" name=\"accept_expiration\">\n                </div>\n            </section>\n\n            <div class=\"initials-bar\">\n                <div>Seller Initials: <input type=\"text\" maxlength=\"3\"></div>\n                <div>Buyer Initials: <input type=\"text\" maxlength=\"3\"></div>\n            </div>\n\n            <!-- SIGNATURES -->\n            <section>\n                <h3>Signatures</h3>\n                <div class=\"signature-grid\">\n                    <div>\n                        <div class=\"form-group\">\n                            <label>Buyer 1 Printed Name:</label>\n                            <input type=\"text\" name=\"buyer1_sig_name\">\n                        </div>\n                        <div class=\"signature-line\">Buyer 1 Signature / Date</div>\n                    </div>\n                    <div>\n                        <div class=\"form-group\">\n                            <label>Buyer 2 Printed Name:</label>\n                            <input type=\"text\" name=\"buyer2_sig_name\">\n                        </div>\n                        <div class=\"signature-line\">Buyer 2 Signature / Date</div>\n                    </div>\n                    <div>\n                        <div class=\"form-group\">\n                            <label>Seller 1 Printed Name:</label>\n                            <input type=\"text\" name=\"seller1_sig_name\">\n                        </div>\n                        <div class=\"signature-line\">Seller 1 Signature / Date</div>\n                    </div>\n                    <div>\n                        <div class=\"form-group\">\n                            <label>Seller 2 Printed Name:</label>\n                            <input type=\"text\" name=\"seller2_sig_name\">\n                        </div>\n                        <div class=\"signature-line\">Seller 2 Signature / Date</div>\n                    </div>\n                </div>\n            </section>\n\n        </form>\n\n        <div style=\"text-align: center; margin-top: 30px;\" class=\"no-print\">\n            <button class=\"btn\" onclick=\"downloadPDF()\">Download / Print PDF</button>\n        </div>\n    </div>\n\n    <script>\n        function calculateTotal() {\n            const getVal = id => parseFloat(document.getElementById(id).value) || 0;\n            const total = getVal('calc_a') + getVal('calc_b') + getVal('calc_c') + getVal('calc_d') + getVal('calc_e') + getVal('calc_bal');\n            document.getElementById('calc_total').value = total ? '$' + total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '';\n        }\n\n        function downloadPDF() {\n            window.print();\n        }\n    <\/script>\n</body>\n</html>";

        // --- Load all frames ---
        function loadSwiftFrame(iframeId, loadingId, html) {
            const frame = document.getElementById(iframeId);
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            frame.addEventListener('load', function onLoad() {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.style.display = 'none';
                frame.removeEventListener('load', onLoad);
            });
            frame.src = url;
        }

        function switchSystemApp(which) {
            const isAnalyzer = which === 'analyzer';
            const isLeadhub = which === 'leadhub';
            const isContract = which === 'contract';

            document.getElementById('frameAnalyzer').classList.toggle('active', isAnalyzer);
            document.getElementById('frameLeadhub').classList.toggle('active', isLeadhub);
            document.getElementById('frameContract').classList.toggle('active', isContract);

            document.getElementById('navBtnAnalyzer').classList.toggle('active', isAnalyzer);
            document.getElementById('navBtnLeadhub').classList.toggle('active', isLeadhub);
            document.getElementById('navBtnContract').classList.toggle('active', isContract);

            // Show/hide loading indicators
            document.getElementById('loadingAnalyzer').style.display = isAnalyzer ? 'flex' : 'none';
            document.getElementById('loadingLeadhub').style.display = isLeadhub ? 'flex' : 'none';
            document.getElementById('loadingContract').style.display = isContract ? 'flex' : 'none';
        }

        // Load all three apps
        loadSwiftFrame('frameAnalyzer', 'loadingAnalyzer', SWIFT_APP_ANALYZER_HTML);
        loadSwiftFrame('frameLeadhub', 'loadingLeadhub', SWIFT_APP_LEADHUB_HTML);
        loadSwiftFrame('frameContract', 'loadingContract', SWIFT_APP_CONTRACT_HTML);
    </script>
