el>\n<input type=\"text\" id=\"globalSellerName\" placeholder=\"John Doe\">\n</div>\n\n<div>\n<label><strong>Property Address</strong></label>\n<div class=\"input-with-action\">\n<input type=\"text\" id=\"globalPropertyAddress\" placeholder=\"123 Main St\">\n<button type=\"button\" class=\"zillow-btn\" id=\"runZillowCompsBtn\" title=\"Run Comps\">Z</button>\n</div>\n</div>\n\n<div>\n<label><strong>Agent Name</strong></label>\n<input type=\"text\" id=\"globalAgentName\" placeholder=\"Agent Smith\">\n</div>\n\n<div>\n<label><strong>Phone Number</strong></label>\n<input type=\"text\" id=\"globalPhoneNumber\" placeholder=\"(555) 555-5555\">\n</div>\n</div>\n\n<div class=\"container\">\n\n<div class=\"sidebar\">\n<div>\n<div class=\"sidebar-header-row\">\n<h2>Scripts</h2>\n<button class=\"theme-toggle-btn\" id=\"themeToggle\" onclick=\"toggleTheme()\">\ud83c\udf19 Dark Mode</button>\n</div>\n<button class=\"tab-btn active\" onclick=\"openTab(event,'tab1')\">\ud83d\udcde Intake Call Script</button>\n<button class=\"tab-btn\" onclick=\"openTab(event,'tab3')\">\u26a1 60-Second Offer Script</button>\n<button class=\"tab-btn\" onclick=\"openTab(event,'tab4')\" style=\"border-color: #d97706; font-weight: 800;\">\ud83d\udea8 Pre-Foreclosure Script</button>\n<button class=\"tab-btn\" onclick=\"openTab(event,'tab5')\" style=\"border-color: #2563eb; font-weight: 800;\">\u23f1\ufe0f Expired Listings</button>\n<button class=\"tab-btn\" onclick=\"openTab(event,'tab6')\" style=\"border-color: #10b981; font-weight: 800;\">\ud83e\udeb5 Land Acquisition Script</button>\n<button class=\"tab-btn\" onclick=\"openTab(event,'tab7')\" style=\"border-color: #60a5fa; font-weight: 800;\">\ud83e\uddf1 Cash Buyer Dispo Script</button>\n</div>\n\n<div>\n<div class=\"sidebar-section-title\">Useful Links</div>\n<div class=\"link-stack\">\n<a href=\"https://swiftie83.github.io/TheSwiftplaybook/\" target=\"_blank\" class=\"link-btn\">\ud83d\udcd6 Swift Wholesaling Playbook \u2197</a>\n<a href=\"https://docs.google.com/document/d/1QWwFLUkfi3o2w2SMQVPMJ5NFdWA4Zpcs-36NOcgJgGA/edit?usp=sharing\" target=\"_blank\" class=\"link-btn\" style=\"border-style: dashed; color: #2563eb;\">\u26a1 Swift Rebuttal Blueprints \u2197</a>\n<a href=\"https://swiftie83.github.io/Swift-EOD-Report/\" target=\"_blank\" class=\"link-btn\" style=\"color: #2563eb; font-weight: 800;\">\ud83d\ude80 Swift Eod Report \u2197</a>\n<a href=\"https://swiftie83.github.io/Swift-Acquisition-Hub/\" target=\"_blank\" class=\"link-btn\">\ud83c\udfaf Swift Acquisition Hub \u2197</a>\n<a href=\"https://swift-dispo-hub-531241044737.us-east1.run.app/\" target=\"_blank\" class=\"link-btn\">\ud83e\uddf1 Swift Dispo Hub \u2197</a>\n<a href=\"https://swiftie83.github.io/SWIFT-A.G.E.N.T.-DOMINATION-/\" target=\"_blank\" class=\"link-btn\" style=\"color: #2563eb; font-weight: 800;\">\ud83d\udc51 SWIFT A.G.E.N.T. DOMINATION\u2122 \u2197</a>\n</div>\n</div>\n\n<div>\n<div class=\"sidebar-section-title\">Active Buyer Scratchpad</div>\n<textarea class=\"scratchpad-area\" id=\"dispoScratchpad\" placeholder=\"Drop custom buyer terms, lock-out dates, or unique access instructions here...\"></textarea>\n<button class=\"dispo-btn\" onclick=\"copyDispoNote()\">Copy Dispo Note</button>\n</div>\n\n<div>\n<div class=\"sidebar-section-title\">Community Broadcasts</div>\n<div class=\"social-footer\">\n<a href=\"https://facebook.com/share/g/1AfaCVgUmP\" target=\"_blank\" class=\"social-btn fb-btn\">Facebook</a>\n<a href=\"https://www.youtube.com/@swiftequitysolutions\" target=\"_blank\" class=\"social-btn yt-btn\">YouTube</a>\n</div>\n</div>\n</div>\n\n<div class=\"content\">\n\n<!-- TAB 1: FULL INTAKE -->\n<div id=\"tab1\" class=\"tab-content active\">\n<div class=\"card\">\n<h2>\ud83d\udcde FULL INTAKE CALL SCRIPT</h2>\n\n<div class=\"psych-tracker\">\n<div class=\"tracker-step active-step\" id=\"t1-step-hook\">1. Intro Hook</div>\n<div class=\"tracker-step\" id=\"t1-step-condition\">2. Diagnostics</div>\n<div class=\"tracker-step\" id=\"t1-step-motivation\">3. Situation</div>\n<div class=\"tracker-step\" id=\"t1-step-anchor\">4. Terms & Price</div>\n</div>\n\n<div class=\"section-title\">OPENING</div>\n<div class=\"question-block\">\n<div class=\"question\">Hi, is this <span class=\"dynamic-seller\">[Owner\u2019s Name]</span>?</div>\n<textarea data-label=\"Opening Check-in\" onfocus=\"activateStep('t1', 't1-step-hook')\"></textarea>\n<span class=\"instant-rebuttal-btn\" onclick=\"toggleLiveRebuttal('reb-t1-wrong-num')\">Seller Says: \"Who is this / Wrong number\"</span>\n<div class=\"live-rebuttal-box\" id=\"reb-t1-wrong-num\">\n<strong>Pivoting Script:</strong> \"Ah, I might have the wrong file layout here! I was searching for the historical owner of <span class=\"dynamic-property\">[Property Address]</span>. Do you happen to have any tie to that asset or area, or did the data records drop the ball?\"\n</div>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Hi <span class=\"dynamic-seller\">[Owner\u2019s Name]</span>, this is <span class=\"dynamic-agent\">[VA Name]</span> calling on behalf of <span class=\"dynamic-business\">(Your Company)</span>. We\u2019re local investors actively buying in your area. I reviewed your property and wanted to see if you were interested in selling.</div>\n<textarea data-label=\"Company Intro Pitch\" onfocus=\"activateStep('t1', 't1-step-hook')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Did I catch you at an okay time?</div>\n<textarea data-label=\"Timing Check\" onfocus=\"activateStep('t1', 't1-step-hook')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Could you tell me more about the property \u2014 beds, baths, square footage, and property history?</div>\n<textarea data-label=\"Property Overview Basics\" onfocus=\"activateStep('t1', 't1-step-condition')\"></textarea>\n</div>\n\n<div class=\"section-title\">PROPERTY CONDITION</div>\n<div class=\"question-block\">\n<div class=\"question\">How old is the roof?</div>\n<textarea data-label=\"Roof Age\" onfocus=\"activateStep('t1', 't1-step-condition')\"></textarea>\n<span class=\"instant-rebuttal-btn\" onclick=\"toggleLiveRebuttal('reb-t1-why-asking')\">Seller Says: \"Why do you need to know about repairs if you're offering cash?\"</span>\n<div class=\"live-rebuttal-box\" id=\"reb-t1-why-asking\">\n<strong>Pivoting Script:</strong> \"Great question! Because we buy 100% as-is, we absorb all future repair costs so you don't have to. Getting an upfront snapshot lets us run an absolute max-value offer without needing internal contractor walkthroughs later.\"\n</div>\n</div>\n<div class=\"question-block\"><div class=\"question\">When was the kitchen last updated?</div><textarea data-label=\"Kitchen Updates\" onfocus=\"activateStep('t1', 't1-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Does the HVAC system work and when was it serviced?</div><textarea data-label=\"HVAC Condition\" onfocus=\"activateStep('t1', 't1-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Any foundation issues or cracks?</div><textarea data-label=\"Foundation Diagnostics\" onfocus=\"activateStep('t1', 't1-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Any cracks in walls or ceilings?</div><textarea data-label=\"Wall/Ceiling Cracks\" onfocus=\"activateStep('t1', 't1-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Anything else needing updates or repairs?</div><textarea data-label=\"General Repairs Needed\" onfocus=\"activateStep('t1', 't1-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Estimated repair cost?</div><textarea data-label=\"Estimated Repair Cost\" onfocus=\"activateStep('t1', 't1-step-condition')\"></textarea></div>\n\n<div class=\"section-title\">SELLER MOTIVATION</div>\n<div class=\"question-block\">\n<div class=\"question\">Why are you considering selling?</div>\n<select data-label=\"Motivation Type\" onfocus=\"activateStep('t1', 't1-step-motivation')\">\n<option value=\"\">Select Motivation</option>\n<option value=\"Preforeclosure\">Preforeclosure</option>\n<option value=\"Divorce\">Divorce</option>\n<option value=\"Inheritance\">Inheritance</option>\n<option value=\"Tired Landlord\">Tired Landlord</option>\n<option value=\"Relocation\">Relocation</option>\n<option value=\"Health Issues\">Health Issues</option>\n</select>\n<textarea data-label=\"Motivation Context\" style=\"margin-top:4px;\" placeholder=\"Add deep situational context...\" onfocus=\"activateStep('t1', 't1-step-motivation')\"></textarea>\n</div>\n\n<div class=\"section-title\">OCCUPANCY</div>\n<div class=\"question-block\">\n<div class=\"question\">Do you live there now or is it rented/vacant?</div>\n<select data-label=\"Current Occupancy Status\" onfocus=\"activateStep('t1', 't1-step-motivation')\">\n<option value=\"\">Select Occupancy</option>\n<option value=\"Owner Occupied\">Owner Occupied</option>\n<option value=\"Rented\">Rented</option>\n<option value=\"Vacant\">Vacant</option>\n<option value=\"Squatters\">Squatters</option>\n</select>\n<textarea data-label=\"Occupancy Notes\" style=\"margin-top:4px;\" placeholder=\"Lease rules, structural state, etc...\" onfocus=\"activateStep('t1', 't1-step-motivation')\"></textarea>\n</div>\n<div class=\"question-block\"><div class=\"question\">If vacant, how long?</div><textarea data-label=\"Vacancy Length\" onfocus=\"activateStep('t1', 't1-step-motivation')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Do you have current photos?</div><textarea data-label=\"Photos Availability\" onfocus=\"activateStep('t1', 't1-step-motivation')\"></textarea></div>\n\n<div class=\"section-title\">TIMELINE + FINANCIAL</div>\n<div class=\"question-block\"><div class=\"question\">How quickly do you need to sell?</div><textarea data-label=\"Selling Timeline Urgency\" onfocus=\"activateStep('t1', 't1-step-motivation')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Mortgage or free and clear?</div><textarea data-label=\"Mortgage Encumbrance Status\" onfocus=\"activateStep('t1', 't1-step-anchor')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Monthly payment?</div><textarea data-label=\"Monthly Liability Amount\" onfocus=\"activateStep('t1', 't1-step-anchor')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Current or behind?</div><textarea data-label=\"Payment Standing Status\" onfocus=\"activateStep('t1', 't1-step-anchor')\"></textarea></div>\n\n<div class=\"section-title\">PRICE</div>\n<div class=\"question-block\">\n<div class=\"question\">Have you thought about what price you'd want?</div>\n<textarea data-label=\"Target Asking Price\" onfocus=\"activateStep('t1', 't1-step-anchor')\"></textarea>\n</div>\n\n<div class=\"section-title\">CREATIVE FINANCE</div>\n<div class=\"question-block\">\n<div class=\"question\">If cash doesn\u2019t work, would you be open to:</div>\n<select data-label=\"Creative Financing Openness\" onfocus=\"activateStep('t1', 't1-step-anchor')\">\n<option value=\"\">Select Strategy</option>\n<option value=\"Novation\">Novation</option>\n<option value=\"Owner Financing\">Owner Financing</option>\n<option value=\"Subject-To\">Subject-To</option>\n<option value=\"Maybe\">Maybe</option>\n<option value=\"No\">No</option>\n</select>\n</div>\n\n<div class=\"closing-script-block\">\n<p>Thank you, <strong class=\"dynamic-seller\">[Owner\u2019s Name]</strong>, for answering my questions! Next, I'll share this with our Acquisition Manager. He/She will team up with one of our trusted realtors to do a thorough market analysis of your property.</p>\n<p>Once that\u2019s done, we\u2019ll get back to you with our offer and talk about how we can help.</p>\n<p>Do you have any questions for me so far? Awesome!</p>\n<p><strong>Thanks again for choosing <span class=\"dynamic-business\">(Your Company)</span> \u2014 we\u2019re excited to work with you!</strong></p>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Write any other info you feel is important</div>\n<textarea data-label=\"Operational Log Notes\" placeholder=\"Drop any additional critical details here...\"></textarea>\n</div>\n\n<div class=\"section-title\">LEAD STATUS</div>\n<div class=\"lead-status-wrap\">\n<label class=\"lead-option hot-option\">\n<input type=\"radio\" name=\"leadStatus\" value=\"HOT LEAD\"> \ud83d\udd25 HOT LEAD\n</label>\n<label class=\"lead-option warm-option\">\n<input type=\"radio\" name=\"leadStatus\" value=\"WARM LEAD\"> \ud83d\udfe0 WARM LEAD\n</label>\n<label class=\"lead-option cold-option\">\n<input type=\"radio\" name=\"leadStatus\" value=\"COLD LEAD\"> \ud83d\udd35 COLD LEAD\n</label>\n</div>\n\n<div class=\"button-row\">\n<button class=\"btn save-btn\" onclick=\"alert('Lead Workspace Locally Saved!')\">Save Lead</button>\n<button class=\"btn pdf-btn\" onclick=\"downloadPDF()\">Download PDF</button>\n</div>\n</div>\n</div>\n\n<!-- TAB 3: 60-SECOND SCRIPT -->\n<div id=\"tab3\" class=\"tab-content\">\n<div class=\"card\">\n<h2>\u26a1 60-SECOND PROPERTY CONDITION SCRIPT</h2>\n\n<div class=\"psych-tracker\">\n<div class=\"tracker-step active-step\" id=\"t3-step-hook\">1. Out of the Gate</div>\n<div class=\"tracker-step\" id=\"t3-step-condition\">2. High-Speed Diagnostics</div>\n<div class=\"tracker-step\" id=\"t3-step-motivation\">3. Move Plan</div>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Seller says: \u201cJust make me an offer.\u201d</div>\n<div class=\"rebuttal\">\u201cThat\u2019s fair. I don\u2019t want to throw out a random number and accidentally disrespect you.\u201d</div>\n</div>\n\n<div class=\"section-title\">SELLER MOTIVATION</div>\n<div class=\"question-block\">\n<div class=\"question\">Why are you considering selling?</div>\n<select data-label=\"Motivation Type (60s Script)\" onfocus=\"activateStep('t3', 't3-step-hook')\">\n<option value=\"\">Select Motivation</option>\n<option value=\"Preforeclosure\">Preforeclosure</option>\n<option value=\"Divorce\">Divorce</option>\n<option value=\"Inheritance\">Inheritance</option>\n<option value=\"Tired Landlord\">Tired Landlord</option>\n<option value=\"Relocation\">Relocation</option>\n<option value=\"Health Issues\">Health Issues</option>\n</select>\n<textarea data-label=\"Motivation Context (60s Script)\" style=\"margin-top:4px;\" placeholder=\"Add deep situational context...\" onfocus=\"activateStep('t3', 't3-step-hook')\"></textarea>\n<span class=\"instant-rebuttal-btn\" onclick=\"toggleLiveRebuttal('reb-t3-ballpark')\">Seller Enforces: \"Just give me a ballpark number right now or let me go.\"</span>\n<div class=\"live-rebuttal-box\" id=\"reb-t3-ballpark\">\n<strong>Pivoting Script:</strong> \"If I give you a blind ballpark, it will either be way too low and insult you, or artificially high and look like bait-and-switch. Give me exactly 45 seconds to confirm your asset layout details, and I will have an actionable underwritten range ready.\"\n</div>\n</div>\n\n<div class=\"section-title\">PROPERTY HEALTH CHECK</div>\n<div class=\"question-block\"><div class=\"question\">How old is the roof?</div><textarea data-label=\"60s Roof Check\" onfocus=\"activateStep('t3', 't3-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Kitchen or bathroom updated?</div><textarea data-label=\"60s Living Space Check\" onfocus=\"activateStep('t3', 't3-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Any major repairs needed?</div><textarea data-label=\"60s Structural Disruption Log\" onfocus=\"activateStep('t3', 't3-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Is the property occupied?</div><textarea data-label=\"60s Physical Occupant Check\" onfocus=\"activateStep('t3', 't3-step-condition')\"></textarea></div>\n<div class=\"question-block\"><div class=\"question\">Would you send photos?</div><textarea data-label=\"60s Photos Commit\" onfocus=\"activateStep('t3', 't3-step-condition')\"></textarea></div>\n\n<div class=\"closing-script-block\">\n<p>Thank you, <strong class=\"dynamic-seller\">[Owner\u2019s Name]</strong>, for answering my questions! Next, I'll share this with our Acquisition Manager. He/She will team up with one of our trusted realtors to do a thorough market analysis of your property.</p>\n<p>Once that\u2019s done, we\u2019ll get back to you with our offer and talk about how we can help.</p>\n<p>Do you have any questions for me so far? Awesome!</p>\n<p><strong>Thanks again for choosing <span class=\"dynamic-business\">(Your Company)</span> \u2014 we\u2019re excited to work with you!</strong></p>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Write any other info you feel is important</div>\n<textarea data-label=\"60s Operational Log Notes\" placeholder=\"Drop any additional critical details here...\" onfocus=\"activateStep('t3', 't3-step-motivation')\"></textarea>\n</div>\n\n<div class=\"button-row\">\n<button class=\"btn save-btn\" onclick=\"alert('Lead Workspace Locally Saved!')\">Save Lead</button>\n<button class=\"btn pdf-btn\" onclick=\"downloadPDF()\">Download PDF</button>\n</div>\n</div>\n</div>\n\n<!-- TAB 4: PRE-FORECLOSURE ACQUISITION SCRIPT -->\n<div id=\"tab4\" class=\"tab-content\">\n<div class=\"card\">\n<h2>\ud83d\udea8 PRE-FORECLOSURE ACQUISITION SCRIPT</h2>\n\n<div class=\"psych-tracker\">\n<div class=\"tracker-step active-step\" id=\"t4-step-hook\">1. Empathy Hook</div>\n<div class=\"tracker-step\" id=\"t4-step-deep\">2. Foreclosure Deep-Dive</div>\n<div class=\"tracker-step\" id=\"t4-step-debt\">3. Debt Structuring</div>\n<div class=\"tracker-step\" id=\"t4-step-blueprint\">4. Resolution Blueprint</div>\n</div>\n\n<div class=\"section-title\">THE EMPATHY HOOK & SENSITIVE APPROACH</div>\n<div class=\"question-block\">\n<div class=\"question\">\"Hello <span class=\"dynamic-seller\">[Owner\u2019s Name]</span>? My name is <span class=\"dynamic-agent\">[VA Name]</span> with <span class=\"dynamic-business\">(Your Company)</span>. I'm reaching out because our system flagged the property at <span class=\"dynamic-property\">[Property Address]</span> as showing up on public notices recently. We specialize in helping homeowners navigate stressful timeline situations directly with banks. I just wanted to see if you are looking to stay in the home, or if you're exploring options to transition out smoothly?\"</div>\n<textarea data-label=\"Pre-Foreclosure Empathy Opening\" onfocus=\"activateStep('t4', 't4-step-hook')\"></textarea>\n<span class=\"instant-rebuttal-btn\" onclick=\"toggleLiveRebuttal('reb-t4-lawyer')\">Seller Says: \"I'm working with an attorney / My bank is handling it\"</span>\n<div class=\"live-rebuttal-box\" id=\"reb-t4-lawyer\">\n<strong>Pivoting Script:</strong> \"That is excellent that you have representation! Attorneys are great for pushing back dates, but they don't bring cash to closing to actually discharge the balance. We work directly alongside owners to establish real backup solutions so you don't face an abrupt exit if your current option stalls out.\"\n</div>\n</div>\n\n<div class=\"section-title\">TIMELINE & FORECLOSURE DEEP-DIVE</div>\n<div class=\"question-block\">\n<div class=\"question\">\"To ensure we construct the correct game plan, have you been assigned an official Auction or Sheriff Sale date yet by the county or courts?\"</div>\n<select data-label=\"Auction Date Status\" onfocus=\"activateStep('t4', 't4-step-deep')\">\n<option value=\"\">Is Auction Date Set?</option>\n<option value=\"Yes - Within 30 Days\">Yes - Within 30 Days</option>\n<option value=\"Yes - 30-90 Days Out\">Yes - 30-90 Days Out</option>\n<option value=\"No Date Set Yet\">No Date Set Yet</option>\n<option value=\"Unsure / Avoided\">Unsure / Avoided</option>\n</select>\n<textarea data-label=\"Specific Auction Date Details\" style=\"margin-top:4px;\" placeholder=\"Enter specific date or notes here...\" onfocus=\"activateStep('t4', 't4-step-deep')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"Have you attempted to work out a Loan Modification, Forbearance agreement, or Short Sale directly with your current lender?\"</div>\n<textarea data-label=\"Lender Mitigation History\" onfocus=\"activateStep('t4', 't4-step-deep')\"></textarea>\n</div>\n\n<div class=\"section-title\">DEBT STRUCTURING & LIEN OVERVIEW</div>\n<div class=\"question-block\">\n<div class=\"question\">\"In order to accurately build out a full payout strategy that leaves your credit intact, do you know roughly what the total reinstatement amount is to bring the mortgage completely current right now?\"</div>\n<textarea data-label=\"Reinstatement Amount Balance\" onfocus=\"activateStep('t4', 't4-step-debt')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"And what is the total remaining payoff balance left on that primary mortgage statement?\"</div>\n<textarea data-label=\"Total Mortgage Payoff\" onfocus=\"activateStep('t4', 't4-step-debt')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"Are there any secondary liabilities tied to the title that we need to handle for you, like a second mortgage, tax liens, HOA dues, or mechanics liens?\"</div>\n<textarea data-label=\"Secondary Liens / Tax Encumbrances\" onfocus=\"activateStep('t4', 't4-step-debt')\"></textarea>\n</div>\n\n<div class=\"section-title\">RESOLUTION BLUEPRINT & CLOSING CAPTURE</div>\n<div class=\"question-block\">\n<div class=\"question\">\"If we can step in, handle your back payments entirely, and coordinate a cash option that allows you to walk away cleanly with credit protection and cash in your pocket to relocate, would that be a path you'd want to run with?\"</div>\n<textarea data-label=\"Resolution Blueprint Commitment\" onfocus=\"activateStep('t4', 't4-step-blueprint')\"></textarea>\n</div>\n\n<div class=\"closing-script-block\">\n<p>Thank you for your transparency, <strong class=\"dynamic-seller\">[Owner\u2019s Name]</strong>. Time is our absolute highest priority right now since the bank works on fixed deadlines. I am going to escalate your file instantly to our Senior Acquisition Specialist.</p>\n<p>They will pull the specific title details and formulate an emergency cash blueprint or structural adjustment approach to step between you and the lender.</p>\n<p><strong>Hang tight\u2014<span class=\"dynamic-business\">(Your Company)</span> is on your side, and we will guide you through this step-by-step!</strong></p>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Write any other info you feel is important</div>\n<textarea data-label=\"Pre-Foreclosure Emergency Log\" placeholder=\"Drop urgent foreclosure tracking data, communication patterns, or banking agent names here...\" onfocus=\"activateStep('t4', 't4-step-blueprint')\"></textarea>\n</div>\n\n<div class=\"button-row\">\n<button class=\"btn save-btn\" onclick=\"alert('Lead Workspace Locally Saved!')\">Save Lead</button>\n<button class=\"btn pdf-btn\" onclick=\"downloadPDF()\">Download PDF</button>\n</div>\n</div>\n</div>\n\n<!-- TAB 5: EXPIRED LISTINGS SCRIPT -->\n<div id=\"tab5\" class=\"tab-content\">\n<div class=\"card\">\n<h2>\u23f1\ufe0f EXPIRED LISTINGS SCRIPT</h2>\n\n<div class=\"psych-tracker\">\n<div class=\"tracker-step active-step\" id=\"t5-step-hook\">1. Out of the Market Hook</div>\n<div class=\"tracker-step\" id=\"t5-step-motivation\">2. Motivation & Alignment</div>\n<div class=\"tracker-step\" id=\"t5-step-discovery\">3. Price Discovery</div>\n<div class=\"tracker-step\" id=\"t5-step-closing\">4. Options Closing</div>\n</div>\n\n<div class=\"section-title\">OPENING HOOK</div>\n<div class=\"question-block\">\n<div class=\"question\">You: \"Hi, is this <span class=\"dynamic-seller\">[Seller Name]</span>?\"</div>\n<textarea data-label=\"Seller Name Check\" onfocus=\"activateStep('t5', 't5-step-hook')\" placeholder=\"Seller Answer: Yes.\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">You: \"My name is <span class=\"dynamic-agent\">{{Agent Name}}</span> with <span class=\"dynamic-business\">{{Company name}}</span>. I'm calling about the property on <span class=\"dynamic-property\">{{Address}}</span>. I noticed the listing came off the market and I was curious\u2014did you still want to sell it, or are you taking a break for now?\"</div>\n<textarea data-label=\"Expired Listing Pitch Response\" onfocus=\"activateStep('t5', 't5-step-hook')\" placeholder=\"(Pause. Let them talk.)\"></textarea>\n</div>\n\n<div class=\"section-title\">IF THEY WANT TO SELL</div>\n<div class=\"question-block\">\n<div class=\"question\">You: \"Got it. Out of curiosity, what do you think stopped it from selling?\"</div>\n<textarea data-label=\"Stalled Analysis Notes\" onfocus=\"activateStep('t5', 't5-step-motivation')\" placeholder=\"(Listen carefully.)\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">You: \"If you could wave a magic wand and get the property sold, what would that ideally look like?\"</div>\n<textarea data-label=\"Ideal Outcome Vision\" onfocus=\"activateStep('t5', 't5-step-motivation')\"></textarea>\n</div>\n\n<div class=\"section-title\">MOTIVATION QUESTIONS</div>\n<div class=\"question-block\">\n<div class=\"question\">\"Why were you looking to sell in the first place?\"</div>\n<textarea data-label=\"Initial Motivation Trigger\" onfocus=\"activateStep('t5', 't5-step-motivation')\"></textarea>\n</div>\n<div class=\"question-block\">\n<div class=\"question\">\"Has anything changed since the listing expired?\"</div>\n<textarea data-label=\"Expired Adjustments History\" onfocus=\"activateStep('t5', 't5-step-motivation')\"></textarea>\n</div>\n<div class=\"question-block\">\n<div class=\"question\">\"If you found the right solution, how soon would you like to sell?\"</div>\n<textarea data-label=\"Ideal Selling Speed Window\" onfocus=\"activateStep('t5', 't5-step-motivation')\"></textarea>\n</div>\n<div class=\"question-block\">\n<div class=\"question\">\"What happens if the property doesn't sell in the next 30 to 60 days?\"</div>\n<textarea data-label=\"Stagnancy Impact Risk Analysis\" onfocus=\"activateStep('t5', 't5-step-motivation')\"></textarea>\n</div>\n\n<div class=\"section-title\">TRANSITION FRAME</div>\n<div class=\"question-block\">\n<div class=\"question\">You: \"The reason I ask is that my company buys properties directly. Sometimes we pay cash, sometimes we use creative financing depending on the situation. I'd like to see if we can create a solution that works for both of us.\"</div>\n<textarea data-label=\"Direct Buyer Pivot Intake\" onfocus=\"activateStep('t5', 't5-step-discovery')\"></textarea>\n</div>\n\n<div class=\"section-title\">PRICE DISCOVERY</div>\n<div class=\"question-block\">\n<div class=\"question\">You: \"What was the last list price?\"</div>\n<textarea data-label=\"Historical List Price Target\" onfocus=\"activateStep('t5', 't5-step-discovery')\" placeholder=\"Seller answers.\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">You: \"If we could eliminate commissions, repairs, showings, inspections, and uncertainty, what's the lowest price you'd realistically consider?\"</div>\n<textarea data-label=\"Absolute Baseline Walkaway Number\" onfocus=\"activateStep('t5', 't5-step-discovery')\" placeholder=\"(Stay quiet. Let them answer first.)\"></textarea>\n</div>\n\n<div class=\"section-title\">LIVE REBUTVAL WORKBENCH</div>\n<div class=\"question-block\">\n<div class=\"question\">Objection: \"I'm Relisting\"</div>\n<div class=\"rebuttal\">You: \"I understand. Before you relist, let me ask you this: if another agent could get it sold, wouldn't the last one have done it already? What do you think will be different this time?\"</div>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Objection: \"I Want Retail Price\"</div>\n<div class=\"rebuttal\">You: \"I completely understand. If I were selling, I'd want top dollar too. My question is: what's more important to you right now\u2014getting the highest possible price or getting the property sold with certainty?\"</div>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Objection: \"How Did You Get My Number?\"</div>\n<div class=\"rebuttal\">You: \"I work with homeowners whose properties recently came off the market. Your information is publicly available through real estate data sources.\"</div>\n</div>\n\n<div class=\"section-title\">APPOINTMENT CLOSING STRATEGY</div>\n<div class=\"question-block\">\n<div class=\"question\">You: \"Based on what you've told me, it sounds like there may be a fit. The next step is simple. Let me take a look at the property and put together some options. If one makes sense, great. If not, no pressure. Does tomorrow afternoon or evening work better?\"</div>\n<textarea data-label=\"Closing Schedule Set\" onfocus=\"activateStep('t5', 't5-step-closing')\"></textarea>\n</div>\n\n<div class=\"closing-script-block\" style=\"border-left-color: #2563eb;\">\n<p><strong>The Real Secret:</strong> The biggest mistake wholesalers make is trying to get a contract on Call #1.</p>\n<p>Top performers often get contracts after: 5\u201315 follow-ups \u2022 Multiple texts \u2022 Multiple calls \u2022 Building rapport over weeks.</p>\n</div>\n\n<div class=\"button-row\">\n<button class=\"btn save-btn\" onclick=\"alert('Lead Workspace Locally Saved!')\">Save Lead</button>\n<button class=\"btn pdf-btn\" onclick=\"downloadPDF()\">Download PDF</button>\n</div>\n</div>\n</div>\n\n<!-- TAB 6: LAND ACQUISITION SCRIPT -->\n<div id=\"tab6\" class=\"tab-content\">\n<div class=\"card\">\n<h2>\ud83e\udeb5 LAND ACQUISITION SCRIPT</h2>\n\n<div class=\"psych-tracker\">\n<div class=\"tracker-step active-step\" id=\"t6-step-open\">1. Opening Hook</div>\n<div class=\"tracker-step\" id=\"t6-step-property\">2. Ownership & Traits</div>\n<div class=\"tracker-step\" id=\"t6-step-utility\">3. Utilities & Access</div>\n<div class=\"tracker-step\" id=\"t6-step-finance\">4. Motivation & Price</div>\n</div>\n\n<div class=\"section-title\">OPENING</div>\n<div class=\"question-block\">\n<div class=\"question\">Hi, is this <span class=\"dynamic-seller\">[Owner Name]</span>?</div>\n<textarea data-label=\"Land Script: Owner Verification\" onfocus=\"activateStep('tab6', 't6-step-open')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">My name is <span class=\"dynamic-agent\">[Agent Name]</span> with <span class=\"dynamic-business\">[Company Name]</span>. I'm reaching out about the property you own at <span class=\"dynamic-property\">[Property Address]</span>. Did I catch you at a bad time?</div>\n<textarea data-label=\"Land Script: Introduction & Timing Check\" onfocus=\"activateStep('tab6', 't6-step-open')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\"><i>(If no)</i> \"Perfect. We're looking to purchase property in the area and wanted to see if you'd consider selling.\"</div>\n<textarea data-label=\"Land Script: Pitch Delivery\" onfocus=\"activateStep('tab6', 't6-step-open')\"></textarea>\n</div>\n\n<div class=\"section-title\">OWNERSHIP & PROPERTY</div>\n<div class=\"question-block\">\n<div class=\"question\">How long have you owned the property?</div>\n<textarea data-label=\"Land Script: Ownership Duration\" onfocus=\"activateStep('tab6', 't6-step-property')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">Is it vacant land, or was there previously a house on the property?</div>\n<textarea data-label=\"Land Script: Land History Profile\" onfocus=\"activateStep('tab6', 't6-step-property')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\"><i>(If former house lot)</i> When was the house demolished? Do you know if utilities are still available?</div>\n<textarea data-label=\"Land Script: Demolition & Legacy Utility Details\" onfocus=\"activateStep('tab6', 't6-step-property')\"></textarea>\n</div>\n\n<div class=\"section-title\">ACCESS</div>\n<div class=\"question-block\">\n<div class=\"question\">Does the property have legal road access? Is it on a paved road or dirt road?</div>\n<textarea data-label=\"Land Script: Road Access Profiling\" onfocus=\"activateStep('tab6', 't6-step-utility')\"></textarea>\n</div>\n\n<div class=\"section-title\">UTILITIES</div>\n<div class=\"question-block\">\n<div class=\"question\">Are water, sewer, and electric available at the property? Do you know if utility connections are already at the lot?</div>\n<textarea data-label=\"Land Script: Core Infrastructure Assessment\" onfocus=\"activateStep('tab6', 't6-step-utility')\"></textarea>\n</div>\n\n<div class=\"section-title\">BUILDABILITY</div>\n<div class=\"question-block\">\n<div class=\"question\">To your knowledge, can the property be built on? Are there any restrictions, easements, HOA requirements, or zoning issues?</div>\n<textarea data-label=\"Land Script: Constraints & Buildability Diagnostics\" onfocus=\"activateStep('tab6', 't6-step-utility')\"></textarea>\n</div>\n\n<div class=\"section-title\">LIENS & TAXES</div>\n<div class=\"question-block\">\n<div class=\"question\">Are there any mortgages, liens, or back taxes on the property?</div>\n<textarea data-label=\"Land Script: Title Liabilities Status\" onfocus=\"activateStep('tab6', 't6-step-finance')\"></textarea>\n</div>\n\n<div class=\"section-title\">MOTIVATION</div>\n<div class=\"question-block\">\n<div class=\"question\">What has you considering selling? If we came to an agreement, how soon would you like to sell?</div>\n<textarea data-label=\"Land Script: Primary Motivation & Speed\" onfocus=\"activateStep('tab6', 't6-step-finance')\"></textarea>\n</div>\n\n<div class=\"section-title\">PRICE</div>\n<div class=\"question-block\">\n<div class=\"question\">What are you hoping to get for the property?</div>\n<textarea data-label=\"Land Script: Target Price Target\" onfocus=\"activateStep('tab6', 't6-step-finance')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\"><i>(If seller says \"Make me an offer\")</i> \"Before we do that, I'd hate to waste your time with a number that doesn't make sense. Is there a price range you'd be comfortable considering?\"</div>\n<textarea data-label=\"Land Script: Price Range Anchor Response\" onfocus=\"activateStep('tab6', 't6-step-finance')\"></textarea>\n</div>\n\n<div class=\"section-title\">CONTACT INFORMATION</div>\n<div class=\"question-block\">\n<div class=\"question\">What's the best phone number to reach you? What's the best email address to send updates to?</div>\n<textarea data-label=\"Land Script: Vital Contact Metadata\" onfocus=\"activateStep('tab6', 't6-step-finance')\"></textarea>\n</div>\n\n<div class=\"closing-script-block\" style=\"border-left-color: #10b981;\">\n<p>Thank you, <strong class=\"dynamic-seller\">[Owner Name]</strong>, for answering my questions!</p>\n<p>Next, I'll share this with our Acquisition Manager. He/She will team up with one of our trusted realtors to do a thorough market analysis of your property.</p>\n<p>Once that's done, we'll get back to you with our offer and talk about how we can help. Do you have any questions for me so far? Awesome!</p>\n<p><strong>Thanks again for choosing <span class=\"dynamic-business\">[Company Name]</span> \u2014 we're excited to work with you!</strong></p>\n</div>\n\n<div class=\"button-row\">\n<button class=\"btn save-btn\" onclick=\"alert('Lead Workspace Locally Saved!')\">Save Lead</button>\n<button class=\"btn pdf-btn\" onclick=\"downloadPDF()\">Download PDF</button>\n</div>\n</div>\n</div>\n\n<!-- TAB 7: CASH BUYER ACQUISITION SCRIPT (DISPO SCRIPT) -->\n<div id=\"tab7\" class=\"tab-content\">\n<div class=\"card\">\n<h2>\ud83e\uddf1 CASH BUYER ACQUISITION SCRIPT (DISPO SCRIPT)</h2>\n\n<div class=\"psych-tracker\">\n<div class=\"tracker-step active-step\" id=\"t7-step-init\">1. Initial Call</div>\n<div class=\"tracker-step\" id=\"t7-step-buybox\">2. Buy Box</div>\n<div class=\"tracker-step\" id=\"t7-step-funding\">3. Funding & Vol</div>\n<div class=\"tracker-step\" id=\"t7-step-closing\">4. Power Close</div>\n</div>\n\n<div class=\"section-title\">INITIAL CALL</div>\n<div class=\"question-block\">\n<div class=\"question\">You: \"Hey, is this <span class=\"dynamic-seller\">[Buyer's Name]</span>?\"</div>\n<div class=\"rebuttal\">Buyer: Yes.</div>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">You: \"Awesome. My name is <span class=\"dynamic-agent\">[Agent Name]</span> with <span class=\"dynamic-business\">(Your Company)</span>. The reason I'm calling is because I noticed you've been actively purchasing investment properties in the area, and I wanted to see what kind of deals you're currently looking for.\"</div>\n<textarea data-label=\"Dispo: Initial Greeting Response\" onfocus=\"activateStep('tab7', 't7-step-init')\"></textarea>\n</div>\n\n<div class=\"section-title\">QUALIFYING QUESTIONS: BUY BOX</div>\n<div class=\"question-block\">\n<div class=\"question\">\"What areas are you buying in right now? What zip codes do you prefer?\"</div>\n<textarea data-label=\"Dispo Buy Box: Preferred Zip Codes / Areas\" onfocus=\"activateStep('tab7', 't7-step-buybox')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"Are you looking for fix-and-flips, rentals, or both?\"</div>\n<textarea data-label=\"Dispo Buy Box: Exit Strategy Type\" onfocus=\"activateStep('tab7', 't7-step-buybox')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"What's your ideal purchase price range?\"</div>\n<textarea data-label=\"Dispo Buy Box: Ideal Price Range\" onfocus=\"activateStep('tab7', 't7-step-buybox')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"How much rehab are you comfortable taking on?\"</div>\n<textarea data-label=\"Dispo Buy Box: Rehab Comfort Level\" onfocus=\"activateStep('tab7', 't7-step-buybox')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"Any property types you avoid?\"</div>\n<textarea data-label=\"Dispo Buy Box: Excluded Property Types\" onfocus=\"activateStep('tab7', 't7-step-buybox')\"></textarea>\n</div>\n\n<div class=\"section-title\">FUNDING & CAPABILITIES</div>\n<div class=\"question-block\">\n<div class=\"question\">\"Are you buying with cash, hard money, private money, or a combination?\"</div>\n<textarea data-label=\"Dispo Funding: Capital Source\" onfocus=\"activateStep('tab7', 't7-step-funding')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"How quickly can you typically close if the numbers make sense?\"</div>\n<textarea data-label=\"Dispo Funding: Speed to Close\" onfocus=\"activateStep('tab7', 't7-step-funding')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"Do you buy individually or through a company?\"</div>\n<textarea data-label=\"Dispo Funding: Entity / Entity Name\" onfocus=\"activateStep('tab7', 't7-step-funding')\"></textarea>\n</div>\n\n<div class=\"section-title\">VOLUME & DECISION MAKING</div>\n<div class=\"question-block\">\n<div class=\"question\">\"How many properties have you purchased in the last 12 months? How many more are you looking to acquire this year?\"</div>\n<textarea data-label=\"Dispo Volume: Annual Run-rate\" onfocus=\"activateStep('tab7', 't7-step-funding')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"When I send deals, are you the decision maker or is there someone else involved?\"</div>\n<textarea data-label=\"Dispo Logistics: Primary Decision Maker\" onfocus=\"activateStep('tab7', 't7-step-funding')\"></textarea>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"What's the fastest way to reach you when I have a deal\u2014call, text, or email?\"</div>\n<textarea data-label=\"Dispo Logistics: Preferred Contact Method\" onfocus=\"activateStep('tab7', 't7-step-funding')\"></textarea>\n</div>\n\n<div class=\"section-title\">BUILD RAPPORT & CONFIRM CRITERIA</div>\n<div class=\"question-block\">\n<div class=\"question\">You: \"Perfect. We move off-market opportunities regularly, and I'm building relationships with serious investors who can close quickly. My goal is to send you deals that actually fit your criteria instead of blasting random properties. Let me make sure I have everything correct.\"</div>\n<div class=\"rebuttal\" style=\"background: var(--bg-card); border-left-color: #10b981;\">\n\ud83d\udccd <strong>Verify Profile Checklist:</strong><br>\n\u2705 Preferred Areas:<br>\n\u2705 Price Range:<br>\n\u2705 Exit Strategy:<br>\n\u2705 Rehab Level:<br>\n\u2705 Funding Source:<br>\n\u2705 Contact Method:\n</div>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">\"One last thing. Do you know any other investors who are actively buying right now? We're always looking to expand our network.\"</div>\n<textarea data-label=\"Dispo Networks: Referral Form Log\" onfocus=\"activateStep('tab7', 't7-step-closing')\"></textarea>\n</div>\n\n<div class=\"section-title\">OBJECTION HANDLING BENCH</div>\n<div class=\"question-block\">\n<div class=\"question\">If They Say They Already Have Too Many Wholesalers</div>\n<div class=\"rebuttal\">You: \"I completely understand. Most investors I talk to already get a lot of deals. The difference is I only want to send opportunities that fit exactly what you're buying. If I can bring you one solid deal that makes you money, would you be open to taking a look?\"</div>\n</div>\n\n<div class=\"question-block\">\n<div class=\"question\">If They Say 'Send Me Something First'</div>\n<div class=\"rebuttal\">You: \"Absolutely. Before I do that, I want to make sure I'm sending something that matches your criteria. It'll only take 30 seconds\u2014what areas and price points are you focused on right now?\"</div>\n</div>\n\n<div class=\"section-title\">HEDGE FUNDS / INSTITUTIONAL BUYERS FRAME</div>\n<div class=\"question-block\">\n<div class=\"question\">If Institutional Profile Checklist Match:</div>\n<div class=\"rebuttal\" style=\"background: var(--bg-main); border-left-color: #2563eb;\">\n\u2022 \"Are there specific acquisition criteria you're currently targeting?\"<br>\n\u2022 \"Any minimum square footage requirements?\"<br>\n\u2022 \"Any preferred zip codes or markets?\"<br>\n\u2022 \"Do you have monthly acquisition goals?\"<br>\n\u2022 \"Who should receive opportunities when we have a deal that meets your criteria?\"\n</div>\n<textarea data-label=\"Dispo Institutional: Fund Acquisition Layout\" onfocus=\"activateStep('tab7', 't7-step-closing')\" placeholder=\"Log fund requirements here...\"></textarea>\n</div>\n\n<div class=\"section-title\">POWER CLOSE</div>\n<div class=\"question-block\">\n<div class=\"question\">You: \"Perfect. I'll add you to our VIP buyer list. Whenever we secure an off-market property that matches your criteria, you'll be one of the first people notified. Looking forward to doing business together.\"</div>\n</div>\n\n<div class=\"closing-script-block\" style=\"border-left-color: #60a5fa;\">\n<strong>Text Follow-Up Template:</strong><br>\n<p>\"Hi [Name], this is <span class=\"dynamic-agent\">[Agent Name]</span> with <span class=\"dynamic-business\">(Your Company)</span>. Thanks for taking my call today. I've added your buying criteria to our database. Looking forward to sending you off-market deals that fit your investment goals. \ud83d\udcc8\ud83c\udfe0\"</p>\n</div>\n\n<div class=\"button-row\">\n<button class=\"btn save-btn\" onclick=\"alert('Lead Workspace Locally Saved!')\">Save Lead</button>\n<button class=\"btn pdf-btn\" onclick=\"downloadPDF()\">Download PDF</button>\n</div>\n</div>\n</div>\n\n</div>\n</div>\n\n<script>\nfunction toggleTheme() {\n    const htmlEl = document.documentElement;\n    const currentTheme = htmlEl.getAttribute('data-theme');\n    const toggleBtn = document.getElementById('themeToggle');\n    \n    if (currentTheme === 'dark') {\n        htmlEl.removeAttribute('data-theme');\n        toggleBtn.innerText = \"\ud83c\udf19 Dark Mode\";\n    } else {\n        htmlEl.setAttribute('data-theme', 'dark');\n        toggleBtn.innerText = \"\u2600\ufe0f Light Mode\";\n    }\n}\n\nfunction activateStep(tabPrefix, stepId) {\n    document.querySelectorAll(`#${tabPrefix} .tracker-step`).forEach(step => {\n        step.classList.remove('active-step');\n    });\n    const target = document.getElementById(stepId);\n    if(target) target.classList.add('active-step');\n}\n\nfunction toggleLiveRebuttal(drawerId) {\n    const block = document.getElementById(drawerId);\n    if(block.style.display === \"block\") {\n        block.style.display = \"none\";\n    } else {\n        block.style.display = \"block\";\n    }\n}\n\nconst businessInput = document.getElementById('globalBusinessName');\nconst sellerInput = document.getElementById('globalSellerName');\nconst agentInput = document.getElementById('globalAgentName');\nconst propertyInput = document.getElementById('globalPropertyAddress');\nconst compButton = document.getElementById('runZillowCompsBtn');\n\nif (compButton) {\n    compButton.addEventListener('click', function(e) {\n        e.preventDefault();\n        \n        if (!propertyInput) return;\n        const rawAddress = propertyInput.value.trim();\n\n        if (!rawAddress || rawAddress === \"[Property Address]\") {\n            alert(\"Please type or paste a valid property address first.\");\n            return;\n        }\n\n        const optimizedAddress = rawAddress.replace(/\\s+/g, ' ');\n        const targetUrl = \"https://www.zillow.com/homes/\" + encodeURIComponent(optimizedAddress) + \"_rb/\";\n        \n        window.open(targetUrl, \"_blank\");\n    });\n}\n\nfunction updateDynamicNames() {\n    const businessName = businessInput.value.trim() || \"(Your Company)\";\n    const sellerName = sellerInput.value.trim() || \"[Owner's Name]\";\n    const agentName = agentInput.value.trim() || \"[VA Name]\";\n    const propertyAddress = propertyInput.value.trim() || \"[Property Address]\";\n    \n    document.querySelectorAll('.dynamic-business').forEach(el => {\n        el.innerText = businessName;\n    });\n    \n    document.querySelectorAll('.dynamic-seller').forEach(el => {\n        el.innerText = sellerName;\n    });\n    \n    document.querySelectorAll('.dynamic-agent').forEach(el => {\n        el.innerText = agentName;\n    });\n\n    document.querySelectorAll('.dynamic-property').forEach(el => {\n        el.innerText = propertyAddress;\n    });\n}\n\nif (businessInput) businessInput.addEventListener('input', updateDynamicNames);\nif (sellerInput) sellerInput.addEventListener('input', updateDynamicNames);\nif (agentInput) agentInput.addEventListener('input', updateDynamicNames);\n\nif (propertyInput) {\n    propertyInput.addEventListener('input', updateDynamicNames);\n    propertyInput.addEventListener('change', updateDynamicNames);\n    propertyInput.addEventListener('paste', () => {\n        setTimeout(updateDynamicNames, 40);\n    });\n}\n\nfunction openTab(evt, tabName){\n    let tabcontent = document.getElementsByClassName(\"tab-content\");\n    for(let i=0;i<tabcontent.length;i++){\n        tabcontent[i].style.display=\"none\";\n        tabcontent[i].classList.remove(\"active\");\n    }\n    let tabbuttons = document.getElementsByClassName(\"tab-btn\");\n    for(let i=0;i<tabbuttons.length;i++){\n        tabbuttons[i].classList.remove(\"active\");\n    }\n    const currentTab = document.getElementById(tabName);\n    currentTab.style.display=\"block\";\n    currentTab.classList.add(\"active\");\n    evt.currentTarget.classList.add(\"active\");\n}\n\nconst leadOptions = document.querySelectorAll('.lead-option');\nleadOptions.forEach(option => {\n    option.addEventListener('click', () => {\n        leadOptions.forEach(o => o.classList.remove('active'));\n        option.classList.add('active');\n        const radio = option.querySelector('input[type=\"radio\"]');\n        if(radio) radio.checked = true;\n    });\n});\n\nfunction copyDispoNote() {\n    const pad = document.getElementById(\"dispoScratchpad\");\n    pad.select();\n    pad.setSelectionRange(0, 99999);\n    navigator.clipboard.writeText(pad.value);\n    alert(\"Dispo Note copied to clipboard!\");\n}\n\nasync function downloadPDF(){\n    const { jsPDF } = window.jspdf;\n    const doc = new jsPDF({ unit: \"mm\", format: \"a4\" });\n\n    // ===== Consistent brand type system (Helvetica everywhere, no font mixing) =====\n    const FONT = \"helvetica\";\n    const NAVY   = [11, 18, 32];\n    const BLUE   = [37, 99, 235];\n    const GOLD   = [245, 158, 11];\n    const INK    = [30, 41, 59];\n    const MUTED  = [100, 116, 139];\n    const LIGHT  = [241, 245, 249];\n    const LINE   = [226, 232, 240];\n\n    const pageWidth  = doc.internal.pageSize.getWidth();\n    const pageHeight = doc.internal.pageSize.getHeight();\n    const marginX = 16;\n    const contentWidth = pageWidth - marginX * 2;\n    let y = 0;\n\n    function drawHeader(){\n        doc.setFillColor(...NAVY);\n        doc.rect(0, 0, pageWidth, 26, \"F\");\n        doc.setFillColor(...GOLD);\n        doc.rect(0, 26, pageWidth, 1.2, \"F\");\n\n        doc.setFont(FONT, \"bold\");\n        doc.setFontSize(15);\n        doc.setTextColor(255, 255, 255);\n        doc.text(\"Swift Acquisition Hub\", marginX, 12);\n\n        doc.setFont(FONT, \"normal\");\n        doc.setFontSize(8.5);\n        doc.setTextColor(190, 202, 224);\n        doc.text(\"Seller Intake  \\u2022  Cold Calling  \\u2022  Qualification  \\u2022  Rebuttals\", marginX, 18.5);\n\n        doc.setFont(FONT, \"normal\");\n        doc.setFontSize(8.5);\n        doc.setTextColor(190, 202, 224);\n        const dateStr = new Date().toLocaleDateString(\"en-US\", { year: \"numeric\", month: \"long\", day: \"numeric\" });\n        doc.text(dateStr, pageWidth - marginX, 12, { align: \"right\" });\n\n        return 36;\n    }\n\n    function drawFooter(pageNum, totalPages){\n        doc.setDrawColor(...LINE);\n        doc.setLineWidth(0.3);\n        doc.line(marginX, pageHeight - 14, pageWidth - marginX, pageHeight - 14);\n\n        doc.setFont(FONT, \"normal\");\n        doc.setFontSize(8);\n        doc.setTextColor(...MUTED);\n        doc.text(\"Swift Equity Solutions \\u2014 Confidential Lead File\", marginX, pageHeight - 9);\n        doc.text(\"Page \" + pageNum + \" of \" + totalPages, pageWidth - marginX, pageHeight - 9, { align: \"right\" });\n    }\n\n    function ensureSpace(needed){\n        if (y + needed > pageHeight - 20){\n            doc.addPage();\n            y = drawHeader();\n        }\n    }\n\n    function sectionLabel(text){\n        ensureSpace(8);\n        doc.setFont(FONT, \"bold\");\n        doc.setFontSize(8);\n        doc.setTextColor(...BLUE);\n        doc.text(text.toUpperCase(), marginX, y);\n        y += 4.5;\n    }\n\n    function bodyText(text){\n        doc.setFont(FONT, \"normal\");\n        doc.setFontSize(10);\n        doc.setTextColor(...INK);\n        const lines = doc.splitTextToSize(String(text), contentWidth);\n        lines.forEach(line => {\n            ensureSpace(6);\n            doc.text(line, marginX, y);\n            y += 5.2;\n        });\n    }\n\n    // ===== Header =====\n    y = drawHeader();\n\n    // ===== Contact / Deal info card =====\n    const business = businessInput.value || \"(Your Company)\";\n    const seller = sellerInput.value || \"N/A\";\n    const property = propertyInput.value || \"N/A\";\n    const agent = agentInput.value || \"N/A\";\n    const phone = document.getElementById(\"globalPhoneNumber\").value || \"N/A\";\n\n    const infoRows = [\n        [\"Company\", business],\n        [\"Seller / Buyer\", seller],\n        [\"Property Address\", property],\n        [\"Agent\", agent],\n        [\"Phone\", phone]\n    ];\n    const cardHeight = infoRows.length * 5.6 + 8;\n\n    doc.setFillColor(...LIGHT);\n    doc.roundedRect(marginX, y, contentWidth, cardHeight, 2, 2, \"F\");\n    doc.setFillColor(...BLUE);\n    doc.roundedRect(marginX, y, 1.4, cardHeight, 0.7, 0.7, \"F\");\n\n    let infoY = y + 7.5;\n    infoRows.forEach(([label, value]) => {\n        doc.setFont(FONT, \"bold\");\n        doc.setFontSize(8);\n        doc.setTextColor(...MUTED);\n        doc.text(label.toUpperCase() + \":\", marginX + 6, infoY);\n\n        doc.setFont(FONT, \"normal\");\n        doc.setFontSize(10);\n        doc.setTextColor(...INK);\n        doc.text(String(value), marginX + 42, infoY);\n\n        infoY += 5.6;\n    });\n    y += cardHeight + 10;\n\n    // ===== Active script section =====\n    const activeTab = document.querySelector(\".tab-content.active\");\n    if (activeTab) {\n        const rawTitle = activeTab.querySelector(\"h2\").innerText;\n        const titleText = rawTitle.replace(/^[^A-Za-z0-9]+/, \"\").trim();\n\n        ensureSpace(12);\n        doc.setFillColor(...BLUE);\n        doc.rect(marginX, y, contentWidth, 9, \"F\");\n        doc.setFont(FONT, \"bold\");\n        doc.setFontSize(11);\n        doc.setTextColor(255, 255, 255);\n        doc.text(titleText, marginX + 4, y + 6.2);\n        y += 9 + 8;\n\n        const operationalFields = activeTab.querySelectorAll(\"textarea, select\");\n        operationalFields.forEach(field => {\n            const val = field.value;\n            const descriptiveLabel = field.getAttribute(\"data-label\") || \"Input Field\";\n\n            if (val && val.trim() !== \"\") {\n                ensureSpace(12);\n                sectionLabel(descriptiveLabel);\n                bodyText(val.trim());\n                y += 3;\n\n                doc.setDrawColor(...LINE);\n                doc.setLineWidth(0.2);\n                ensureSpace(4);\n                doc.line(marginX, y, marginX + contentWidth, y);\n                y += 5;\n            }\n        });\n    }\n\n    // ===== Lead status badge =====\n    const selectedLead = document.querySelector('input[name=\"leadStatus\"]:checked');\n    if (selectedLead) {\n        ensureSpace(16);\n        y += 3;\n\n        let badgeColor = BLUE;\n        const label = selectedLead.value;\n        if (label.includes(\"HOT\")) badgeColor = [220, 38, 38];\n        else if (label.includes(\"WARM\")) badgeColor = [217, 119, 6];\n        else if (label.includes(\"COLD\")) badgeColor = [37, 99, 235];\n\n        doc.setFillColor(...badgeColor);\n        doc.roundedRect(marginX, y, 64, 10, 2, 2, \"F\");\n        doc.setFont(FONT, \"bold\");\n        doc.setFontSize(10);\n        doc.setTextColor(255, 255, 255);\n        doc.text(label, marginX + 32, y + 6.6, { align: \"center\" });\n        y += 14;\n    }\n\n    // ===== Footer on every page =====\n    const totalPages = doc.internal.getNumberOfPages();\n    for (let i = 1; i <= totalPages; i++) {\n        doc.setPage(i);\n        drawFooter(i, totalPages);\n    }\n\n    doc.save(\"Swift-Lead-Manager.pdf\");\n}\n<\/script>\n</body>\n</html>";

        // Update branding: replace Sellmethehouse™ with Swift Acquisition Hub™
        const SWIFT_APP_LEADHUB_HTML = SWIFT_APP_LEADHUB_HTML_RAW
            .replace(/Sellmethehouse™/g, "Swift Acquisition Hub™")
            .replace(/Sellmethehouse/g, "Swift Acquisition Hub");

        // ===== CONTRACT APP HTML (Purchase and Sale Agreement) =====
        const SWIFT_APP_CONTRACT_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Purchase and Sale Agreement - Contract Tab</title>\n    <!-- Import clean vector font to prevent system font rendering glitches in PDF -->\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n    \n    <style>\n        :root {\n            --primary-color: #2c3e50;\n            --accent-color: #2980b9;\n            --light-bg: #f8f9fa;\n            --border-color: #ccc;\n        }\n\n        /* Prevent synthetic bolding and subpixel distortions */\n        * {\n            -webkit-print-color-adjust: exact !important;\n            print-color-adjust: exact !important;\n            font-synthesis: none !important;\n            text-rendering: optimizeLegibility !important;\n            -webkit-font-smoothing: antialiased !important;\n            -moz-osx-font-smoothing: grayscale !important;\n        }\n\n        body {\n            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n            line-height: 1.5;\n            color: #111111;\n            max-width: 900px;\n            margin: 0 auto;\n            padding: 20px;\n            background-color: #f4f6f8;\n        }\n\n        .container {\n            background-color: #ffffff;\n            padding: 40px;\n            border-radius: 8px;\n            box-shadow: 0 4px 10px rgba(0,0,0,0.1);\n        }\n\n        h1, h2 {\n            color: var(--primary-color);\n            text-align: center;\n            margin-bottom: 5px;\n            font-weight: 700;\n        }\n\n        h1 {\n            font-size: 24px;\n            text-transform: uppercase;\n        }\n\n        h2 {\n            font-size: 18px;\n            border-bottom: 2px solid var(--primary-color);\n            padding-bottom: 10px;\n            margin-bottom: 25px;\n        }\n\n        .notice {\n            font-size: 11px;\n            font-style: italic;\n            border: 1px solid #e0e0e0;\n            padding: 10px;\n            background-color: var(--light-bg);\n            margin-bottom: 20px;\n            text-align: justify;\n        }\n\n        section {\n            margin-bottom: 20px;\n        }\n\n        h3 {\n            font-size: 14px;\n            font-weight: 700;\n            color: var(--primary-color);\n            border-bottom: 1px solid #eee;\n            padding-bottom: 4px;\n            margin-bottom: 10px;\n            text-transform: uppercase;\n        }\n\n        .grid {\n            display: grid;\n            grid-template-columns: repeat(2, 1fr);\n            gap: 15px;\n        }\n\n        .grid-full {\n            grid-column: span 2;\n        }\n\n        .form-group {\n            display: flex;\n            flex-direction: column;\n        }\n\n        label {\n            font-size: 12px;\n            font-weight: 700;\n            margin-bottom: 4px;\n            color: #222222;\n        }\n\n        input[type=\"text\"],\n        input[type=\"date\"],\n        input[type=\"number\"],\n        textarea,\n        select {\n            width: 100%;\n            padding: 8px;\n            border: 1px solid var(--border-color);\n            border-radius: 4px;\n            font-family: 'Inter', sans-serif;\n            font-size: 13px;\n            font-weight: 400;\n            color: #111111;\n            box-sizing: border-box;\n        }\n\n        textarea {\n            resize: vertical;\n            height: 60px;\n        }\n\n        .price-table {\n            width: 100%;\n            border-collapse: collapse;\n            margin-top: 10px;\n        }\n\n        .price-table th, .price-table td {\n            border: 1px solid #ddd;\n            padding: 8px;\n            font-size: 12px;\n        }\n\n        .price-table th {\n            background-color: var(--light-bg);\n            text-align: left;\n            font-weight: 700;\n        }\n\n        .price-table input {\n            border: none;\n            background: transparent;\n            width: 100%;\n            font-family: 'Inter', sans-serif;\n            font-weight: 400;\n            color: #111111;\n        }\n\n        .price-table input:focus {\n            outline: 1px solid var(--accent-color);\n            background: #fff;\n        }\n\n        .checkbox-group {\n            display: flex;\n            align-items: center;\n            gap: 10px;\n            margin: 5px 0;\n            font-size: 13px;\n        }\n\n        .checkbox-group input {\n            width: auto;\n        }\n\n        .initials-bar {\n            display: flex;\n            justify-content: space-between;\n            background-color: #f1f1f1;\n            padding: 8px 15px;\n            border-radius: 4px;\n            margin: 20px 0;\n            font-size: 12px;\n        }\n\n        .initials-bar div {\n            display: flex;\n            align-items: center;\n            gap: 5px;\n        }\n\n        .initials-bar input {\n            width: 60px;\n            text-transform: uppercase;\n        }\n\n        .signature-grid {\n            display: grid;\n            grid-template-columns: repeat(2, 1fr);\n            gap: 30px;\n            margin-top: 30px;\n        }\n\n        .signature-line {\n            border-top: 1px solid #000;\n            margin-top: 40px;\n            padding-top: 5px;\n            font-size: 12px;\n            font-weight: 700;\n        }\n\n        /* Fixed Action Bar */\n        .action-bar {\n            position: fixed;\n            top: 20px;\n            right: 20px;\n            display: flex;\n            gap: 10px;\n            z-index: 1000;\n        }\n\n        .btn {\n            background-color: var(--accent-color);\n            color: white;\n            border: none;\n            padding: 12px 20px;\n            font-size: 14px;\n            font-weight: 700;\n            border-radius: 5px;\n            cursor: pointer;\n            box-shadow: 0 4px 6px rgba(0,0,0,0.1);\n            transition: background-color 0.2s;\n        }\n\n        .btn:hover {\n            background-color: #1c5980;\n        }\n\n        /* STRICT PDF / PRINT STYLING FIXES */\n        @media print {\n            html, body {\n                background: #ffffff !important;\n                color: #000000 !important;\n                font-family: 'Inter', sans-serif !important;\n                margin: 0 !important;\n                padding: 0 !important;\n                -webkit-print-color-adjust: exact !important;\n            }\n\n            .action-bar, .no-print {\n                display: none !important;\n            }\n\n            .container {\n                box-shadow: none !important;\n                padding: 0 !important;\n                width: 100% !important;\n                max-width: 100% !important;\n            }\n\n            /* Clean up dynamic input controls and placeholders */\n            input, textarea, select {\n                font-family: 'Inter', sans-serif !important;\n                font-weight: 400 !important;\n                font-size: 12px !important;\n                color: #000000 !important;\n                border: none !important;\n                border-bottom: 1px solid #000000 !important;\n                border-radius: 0 !important;\n                padding: 2px 0 !important;\n                background: transparent !important;\n                box-shadow: none !important;\n                -webkit-appearance: none !important;\n                appearance: none !important;\n            }\n\n            /* Hide standard browser calendar icon distorting line height */\n            input[type=\"date\"]::-webkit-calendar-picker-indicator {\n                display: none !important;\n                -webkit-appearance: none !important;\n            }\n\n            .price-table {\n                border: 1px solid #000000 !important;\n            }\n\n            .price-table th, .price-table td {\n                border: 1px solid #000000 !important;\n                color: #000000 !important;\n            }\n\n            .price-table input {\n                border-bottom: none !important;\n            }\n\n            .initials-bar {\n                background: none !important;\n                border: 1px solid #000000 !important;\n            }\n\n            h1, h2, h3, label, strong {\n                font-weight: 700 !important;\n                color: #000000 !important;\n            }\n\n            p, td, input {\n                font-weight: 400 !important;\n                color: #000000 !important;\n            }\n\n            page-break-inside: avoid;\n        }\n    </style>\n</head>\n<body>\n\n    <div class=\"action-bar\">\n        <button class=\"btn\" onclick=\"downloadPDF()\">Download / Print PDF</button>\n    </div>\n\n    <div class=\"container\">\n        <h1>Purchase and Sale Agreement</h1>\n        <h2>Standard Purchase and Sale Agreement - Real Property</h2>\n\n        <div class=\"notice\">\n            <strong>NOTICE:</strong> This is a legal and binding Agreement for the purchase and sale of property. It is appropriate for most, but not all, such transactions. If this form does not appear to either Buyer or Seller to be appropriate for a particular transaction, you are urged to discuss the purchase or sale with an attorney BEFORE YOU SIGN. Most, but not all, provisions of this Agreement are subject to negotiation prior to execution.\n        </div>\n\n        <form id=\"agreementForm\">\n            <!-- 1. PARTIES -->\n            <section>\n                <h3>1. Parties</h3>\n                <p style=\"font-size: 12px;\">This Agreement to buy and sell real property (the \"Agreement\") is made between the following parties:</p>\n                <div class=\"grid\">\n                    <div class=\"form-group\">\n                        <label>Seller 1 Name:</label>\n                        <input type=\"text\" name=\"seller1_name\">\n                    </div>\n                    <div class=\"form-group\">\n                        <label>Seller 1 Address:</label>\n                        <input type=\"text\" name=\"seller1_address\">\n                    </div>\n                    <div class=\"form-group\">\n                        <label>Seller 2 Name:</label>\n                        <input type=\"text\" name=\"seller2_name\">\n                    </div>\n                    <div class=\"form-group\">\n                        <label>Seller 2 Address:</label>\n                        <input type=\"text\" name=\"seller2_address\">\n                    </div>\n                    <div class=\"form-group grid-full\">\n                        <label>Buyer 1 (and his/her/their or their entity's heirs, successors, personal representatives and/or assigns):</label>\n                        <input type=\"text\" name=\"buyer_name\">\n                    </div>\n                    <div class=\"form-group grid-full\">\n                        <label>Buyer Address:</label>\n                        <input type=\"text\" name=\"buyer_address\">\n                    </div>\n                </div>\n                <p style=\"font-size: 11px; margin-top: 8px;\">Seller agrees to sell and Buyer agrees to buy, for the purchase price and upon the terms and conditions stated herein, the real property together with all buildings and other improvements thereon and all appurtenances thereto, in the same condition as they were on the date of Buyer's signature, reasonable wear and tear excepted.</p>\n            </section>\n\n            <!-- 2. REAL PROPERTY TO BE PURCHASED -->\n            <section>\n                <h3>2. Real Property to be Purchased</h3>\n                <div class=\"grid\">\n                    <div class=\"form-group grid-full\">\n                        <label>Street Address:</label>\n                        <input type=\"text\" name=\"property_address\">\n                    </div>\n                    <div class=\"form-group\">\n                        <label>Tax Map / ID:</label>\n                        <input type=\"text\" name=\"tax_id\">\n                    </div>\n                    <div class=\"form-group\">\n                        <label>Legal Description:</label>\n                        <input type=\"text\" name=\"legal_description\">\n                    </div>\n                </div>\n                <p style=\"font-size: 11px; margin-top: 8px;\">\n                    <strong>Included in Sale Price:</strong> The Real Property shall include all items permanently attached to the property on the date Buyer signed this Agreement, including: all electrical, mechanical, lighting, plumbing and heating/cooling fixtures; water softeners; screens; storm windows; TV antenna; ceiling fans; awnings; security, fire, and smoke alarms; garage door openers with controls; venetian blinds; curtain/drapery rods; wall-to-wall carpet; built-in appliances; pool/spa equipment; mailbox; in-ground landscaping; and shrubbery and plants. Unless mentioned below, all personal property is excluded.\n                </p>\n            </section>\n\n            <!-- 3. ADDITIONAL PERSONAL PROPERTY -->\n            <section>\n                <h3>3. Additional Personal Property</h3>\n                <p style=\"font-size: 11px;\">Additional personal property, if any, to be included. There is no leased personal property except as noted below:</p>\n                <div class=\"form-group\">\n                    <textarea name=\"additional_personal_property\"></textarea>\n                </div>\n            </section>\n\n            <!-- 4. PURCHASE PRICE -->\n            <section>\n                <h3>4. Purchase Price</h3>\n                <div class=\"form-group\" style=\"margin-bottom: 15px;\">\n                    <label>Purchase Price ($):</label>\n                    <input type=\"number\" name=\"purchase_price\" placeholder=\"0.00\">\n                </div>\n                <p style=\"font-size: 12px; font-weight: 700;\">Payable as follows:</p>\n                <table class=\"price-table\">\n                    <tr>\n                        <th>Component</th>\n                        <th style=\"width: 200px;\">Amount ($)</th>\n                    </tr>\n                    <tr>\n                        <td>a. Initial Earnest Money Deposit submitted herewith (receipt acknowledged)</td>\n                        <td><input type=\"number\" id=\"calc_a\" name=\"price_a\" oninput=\"calculateTotal()\"></td>\n                    </tr>\n                    <tr>\n                        <td>b. Additional Deposit due upon Seller's Acceptance</td>\n                        <td><input type=\"number\" id=\"calc_b\" name=\"price_b\" oninput=\"calculateTotal()\"></td>\n                    </tr>\n                    <tr>\n                        <td>c. Proceeds of Financing, as specified in Paragraph 6 below</td>\n                        <td><input type=\"number\" id=\"calc_c\" name=\"price_c\" oninput=\"calculateTotal()\"></td>\n                    </tr>\n                    <tr>\n                        <td>d. Subject to Seller's existing financing of approximately</td>\n                        <td><input type=\"number\" id=\"calc_d\" name=\"price_d\" oninput=\"calculateTotal()\"></td>\n                    </tr>\n                    <tr>\n                        <td>e. Balance due Seller, evidenced by a negotiable promissory note of Borrower, delivered by Buyer to Seller at Closing</td>\n                        <td><input type=\"number\" id=\"calc_e\" name=\"price_e\" oninput=\"calculateTotal()\"></td>\n                    </tr>\n                    <tr>\n                        <td>Balance to be paid by certified check or bank check at Closing</td>\n                        <td><input type=\"number\" id=\"calc_bal\" name=\"price_bal\" oninput=\"calculateTotal()\"></td>\n                    </tr>\n                    <tr>\n                        <td><strong>TOTAL PRICE TO BE PAID (must equal Purchase Price)</strong></td>\n                        <td><input type=\"text\" id=\"calc_total\" name=\"price_total\" readonly placeholder=\"$0.00\"></td>\n                    </tr>\n                </table>\n            </section>\n\n            <div class=\"initials-bar\">\n                <div>Seller Initials: <input type=\"text\" maxlength=\"3\"></div>\n                <div>Buyer Initials: <input type=\"text\" maxlength=\"3\"></div>\n            </div>\n\n            <!-- 5. DEPOSITS -->\n            <section>\n                <h3>5. Deposits</h3>\n                <p style=\"font-size: 11px;\">The Deposit(s) specified above shall be made at the stated times. All Deposits shall be made to the Listing Broker or the attorney/title or escrow company conducting the closing. Except at the time of closing, when the deposit shall be delivered to Seller or Seller's designee, the Listing Broker shall not pay the Deposit to anyone without the written consent of all parties to this Agreement. In the event any deposit funds payable pursuant to this Agreement are not paid by Buyer, Seller may give written notice of such failure to Buyer. If such notice is given and a period of five (5) business days passes without Buyer paying the Deposit owed, Seller may declare Buyer in default and shall have the remedies set forth in the \"Buyer's Default/Seller's Default\" paragraph.</p>\n                <p style=\"font-size: 11px;\">Deposit funds shall be held by the designated title company, closing attorney, escrow agent, or other agreed neutral escrow holder and shall be applied at closing or disbursed according to this Agreement and applicable law. Unless otherwise stated in writing, Buyer shall not be required to increase the deposit after the initial deposit has been delivered.</p>\n            </section>\n\n            <!-- 6. CONDITION OF PREMISES -->\n            <section>\n                <h3>6. Condition of Premises</h3>\n                <p style=\"font-size: 11px;\">Buyer represents that Buyer has examined the property and is satisfied with the physical condition, subject to the Inspection Contingency, if applicable. Neither Seller nor any representative of the Seller or Buyer has made any representation or promise other than those expressly stated herein, which Buyer has relied upon in making this Agreement.</p>\n            </section>\n\n            <!-- 7. INSPECTION CONTINGENCY -->\n            <section>\n                <h3>7. Inspection Contingency</h3>\n                <p style=\"font-size: 11px;\">a. Buyer shall have the right to inspect all aspects of the Property, including, but not limited to, the physical condition of the property, the value of the property, the title, the encumbrances, and any matters not shown by public record, and shall have the right, up to the time of Closing, to terminate this Agreement for any reason, in Buyer's sole discretion. Seller is expected to have the utilities on during the time of inspections, and to turn them on if the utilities are currently off. If Buyer is not satisfied with the physical condition of the real property, and so notifies Seller in writing prior to the Closing Date, then Buyer may, at Buyer's option, terminate this Agreement. Buyer may give Seller the option to correct the conditions that are unsatisfactory to Buyer. Should Buyer elect to terminate this Agreement, or should Seller be unwilling to correct any unsatisfactory conditions, Buyer shall notify Seller before the time of Closing of Buyer's election to terminate this Agreement, and if terminated, this Agreement shall be null and void and any deposit monies paid hereunder shall be returned immediately to Buyer, and neither Buyer nor Seller shall have any claims against each other under the terms of this Agreement. If Buyer fails to notify Seller as provided herein, this contingency shall be deemed satisfied and this Agreement shall continue in full force and effect.</p>\n                <div class=\"checkbox-group\">\n                    <input type=\"checkbox\" id=\"waive_inspection\" name=\"waive_inspection\">\n                    <label for=\"waive_inspection\">b. If initiated here, Buyer does NOT choose to have any inspections performed and WAIVES any rights to object to any defects in the property that would have been disclosed by a full and complete inspection.</label>\n                </div>\n            </section>\n\n            <!-- 8. ACCESS -->\n            <section>\n                <h3>8. Access</h3>\n                <p style=\"font-size: 11px;\">Within one (1) business day of the Effective Date, Seller agrees to provide Buyer and Buyer's authorized representatives, contractors, inspectors, appraisers, partners, prospective assignees, and/or end buyers reasonable access to the Property for inspections, due diligence, photographs, measurements, contractor estimates, showings, and other activities reasonably necessary to evaluate, market, assign, finance, or complete the purchase. If the Property is listed with a real estate broker or agent, Seller may coordinate access through the listing agent or another reasonable method, including scheduled or supervised showings. Seller shall use reasonable efforts to maintain access through closing. Buyer agrees to comply with reasonable access procedures established by Seller or Seller's agent and shall be responsible for damage caused by Buyer's negligence or willful misconduct.</p>\n            </section>\n\n            <!-- 9. LEAD-BASED PAINT -->\n            <section>\n                <h3>9. Lead-Based Paint</h3>\n                <p style=\"font-size: 11px;\">The parties acknowledge that dwelling units constructed prior to 1978 are likely to contain lead-based paint, which could create a health hazard. In the event that the real property which is the subject of this Agreement consists of or contains a residential unit built prior to 1978, the parties agree that each party has received, reviewed, signed, and annexed hereto a completed Disclosure and Acknowledgment Form regarding Lead-Based Paint, as required by federal HUD/EPA disclosure regulations.</p>\n            </section>\n\n            <!-- 10. POSSESSION / DELAYS / CLOSING DATE -->\n            <section>\n                <h3>10. Possession / Delays / Closing Date</h3>\n                <div class=\"grid\">\n                    <div class=\"form-group\">\n                        <label>Closing Date:</label>\n                        <input type=\"date\" name=\"closing_date\">\n                    </div>\n                    <div class=\"form-group\">\n                        <label>Title and Escrow Agent:</label>\n                        <input type=\"text\" name=\"title_agent\">\n                    </div>\n                    <div class=\"form-group grid-full\">\n                        <label>Located At:</label>\n                        <input type=\"text\" name=\"title_agent_location\">\n                    </div>\n                </div>\n                <p style=\"font-size: 11px; margin-top: 8px;\">Unless otherwise stated herein, Buyer shall receive exclusive possession and occupancy with keys on the Closing Date. The Real Property shall be maintained by Seller until the time of Closing and shall be transferred in broom-clean condition, free of debris and personal belongings. Buyer shall have the right to a walk-through inspection of the Property within 48 hours prior to the Closing Date. Seller agrees that timely performance of its obligations to close on the scheduled Closing Date is an essential term of this Agreement.</p>\n            </section>\n\n
